name: Build iOS Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          export PATH=$THEOS/bin:$PATH
          
          # Создаем Makefile
          cat > Makefile << 'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:15.0
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = FreedomTweak
          FreedomTweak_FILES = Tweak.x
          FreedomTweak_CFLAGS = -fobjc-arc
          include $(THEOS_MAKE_PATH)/tweak.mk
          after-install::
          	install.exec "killall -9 SpringBoard"
          EOF
          
          # Создаем control файл (информация о твике)
          cat > control << 'EOF'
          Package: com.bebra.freedomtweak
          Name: FreedomTweak
          Version: 1.0
          Architecture: iphoneos-arm64
          Description: Home button redirect to Freedom OS
          Maintainer: Bebra
          Author: Bebra
          Section: Tweaks
          Depends: mobilesubstrate
          EOF
          
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FreedomTweak-DEB
          path: packages/*.deb
